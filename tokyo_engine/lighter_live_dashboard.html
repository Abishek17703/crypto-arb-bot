<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lighter Live</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #000000;
      --card: #0a0a0a;
      --card-2: #050505;
      --border: #1c1c1e;
      --text: #f8fafc;
      --muted: #8e8e93;
      --green: #10b981;
      --red: #ef4444;
    }
    html, body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .wrap { max-width: 72rem; margin: 0 auto; padding: 1.25rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, monospace; font-variant-numeric: tabular-nums; }
    .pos { color: var(--green); }
    .neg { color: var(--red); }

    /* Top Bar */
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 0.75rem;
      margin-bottom: 1rem; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.55rem; font-weight: 700; font-size: 1.05rem; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
    .badge {
      font-size: 0.68rem; font-weight: 600; padding: 0.18rem 0.55rem; border-radius: 999px;
      background: rgba(16,185,129,0.12); color: var(--green); border: 1px solid rgba(16,185,129,0.28);
    }
    .controls { display: flex; align-items: center; gap: 0.45rem; }
    .seed-input {
      width: 76px; background: var(--card); border: 1px solid var(--border); color: var(--text);
      border-radius: 0.45rem; padding: 0.28rem 0.45rem; font-size: 0.8rem;
    }
    .btn {
      background: var(--card); border: 1px solid var(--border); color: var(--muted);
      border-radius: 0.45rem; padding: 0.3rem 0.6rem; font-size: 0.75rem; cursor: pointer;
    }
    .btn:hover { color: var(--text); border-color: #334155; }

    /* Tier 1: Hero Card */
    .hero {
      background: linear-gradient(135deg, #0d0d0f 0%, #050505 100%);
      border: 1px solid #262629; border-radius: 1.1rem; padding: 1.05rem 1.25rem;
      margin-bottom: 0.85rem;
      display: flex; justify-content: space-between; align-items: center; gap: 0.85rem; flex-wrap: wrap;
    }
    .hero-lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 600; }
    .hero-eq { font-size: 2.85rem; font-weight: 800; line-height: 1.05; margin-top: 0.2rem; letter-spacing: -0.02em; }
    .hero-sub { font-size: 0.82rem; color: var(--muted); margin-top: 0.4rem; display: flex; gap: 0.85rem; flex-wrap: wrap; }
    .hero-right { text-align: right; }
    .hero-pnl { font-size: 2.0rem; font-weight: 700; line-height: 1.08; margin-top: 0.2rem; }
    .hero-roi { font-size: 0.78rem; color: var(--muted); margin-top: 0.35rem; }

    /* Tier 2: Secondary Metrics */
    .sec-grid {
      display: grid; grid-template-columns: 1fr; gap: 0.85rem;
      margin-bottom: 1rem;
    }
    .sec-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 0.85rem; padding: 0.9rem 1rem;
    }
    .lbl { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
    .sec-sub { font-size: 0.75rem; color: var(--muted); margin-top: 0.2rem; }
    .tf-row { display: flex; gap: 0.75rem; margin-top: 0.35rem; flex-wrap: wrap; font-size: 0.78rem; }

    /* Tier 3: Chart & Virtualized Trades */
    .main-grid { display: grid; grid-template-columns: 1.08fr 1.12fr; gap: 1rem; }
    .card {
      min-width: 0;
      background: var(--card); border: 1px solid var(--border); border-radius: 0.95rem; padding: 1.05rem;
    }
    .card-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; gap: 0.5rem; }
    .chart-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; width: 100%; }
    .chart-scroll svg { height: 185px; display: block; }

    /* Virtualized 6-Row Viewport: zero lag at 1,000+ orders/sec */
    .tbl-wrap {
      max-height: 256px;
      overflow-y: auto;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      contain: content;
      overscroll-behavior: contain;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    th, td { text-align: left; padding: 0 0.38rem; border-bottom: 1px solid var(--border); white-space: nowrap; height: 36px; line-height: 36px; }
    thead th {
      position: sticky; top: 0; z-index: 3;
      background: var(--card); color: var(--muted); font-weight: 600;
      font-size: 0.66rem; text-transform: uppercase; height: 30px; line-height: 30px;
      box-shadow: 0 1px 0 var(--border);
    }
    .vspacer td { padding: 0 !important; border: 0 !important; line-height: 0 !important; }
    .usd-sub { color: var(--muted); font-size: 0.71rem; margin-left: 0.2rem; }

    @media (max-width: 768px) {
      .wrap { padding: 0.75rem; }
      .controls, .desktop-only { display: none; }
      .hero { padding: 0.85rem 0.95rem; align-items: center; flex-wrap: nowrap; }
      .hero-eq { font-size: 1.95rem; }
      .hero-right { text-align: right; flex-shrink: 0; }
      .hero-pnl { font-size: 1.45rem; }
      .hero-sub { font-size: 0.74rem; gap: 0.55rem; }
      .sec-card { padding: 0.75rem 0.8rem; }
      .main-grid { grid-template-columns: 1fr; gap: 0.75rem; }
      .chart-scroll svg { height: 135px; }
      .tbl-wrap { max-height: 236px; }
      table { font-size: 0.73rem; }
      th, td { padding: 0 0.26rem; height: 34px; line-height: 34px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <span class="dot" id="liveDot"></span>
        <span>Lighter Live</span>
        <span class="badge" id="tierBadge">0% FEE</span>
        <span class="desktop-only mono" id="acctSub" style="font-size:0.75rem;color:var(--muted);font-weight:400;margin-left:0.4rem;">#770015</span>
      </div>
      <div class="controls">
        <span class="lbl">Seed</span>
        <input id="seedInput" class="seed-input mono" type="number" step="0.01" value="100.00" />
        <button class="btn" onclick="saveSeed()">Save</button>
        <button class="btn" onclick="resetHistory()">Reset</button>
      </div>
    </div>

    <!-- Tier 1: Hero Equity & Run Rate -->
    <div class="hero">
      <div>
        <div class="hero-lbl">Total Equity (USDC)</div>
        <div class="hero-eq mono" id="eqVal">$--.--</div>
        <div class="hero-sub mono" id="realSub">
          <span>Net $0.0000 (0.00%)</span>
        </div>
      </div>
      <div class="hero-right">
        <div class="hero-lbl" style="display:inline-flex;align-items:center;gap:0.4rem;">
          <span>Run Rate</span>
          <button class="btn" id="rrBtn" onclick="refreshRunRate()" title="Refresh Run Rate" style="padding:0.1rem 0.38rem;font-size:0.7rem;line-height:1.1;">↻</button>
        </div>
        <div class="hero-pnl mono" id="hrRate">$0.0000/hr</div>
        <div class="hero-roi mono" id="dayRate">$0.00/day</div>
      </div>
    </div>

    <!-- Tier 2: Recent Windows -->
    <div class="sec-grid">
      <div class="sec-card">
        <div class="lbl">Recent Windows</div>
        <div class="tf-row mono">
          <span>5m <b id="tf5m">$0.000</b></span>
          <span>15m <b id="tf15m">$0.000</b></span>
          <span>1h <b id="tf1h">$0.000</b></span>
          <span class="desktop-only">24h <b id="tf24h">$0.000</b></span>
        </div>
      </div>
    </div>

    <!-- Tier 3: Equity Curve & Virtual-Scrolled Positions/Trades -->
    <div class="main-grid">
      <div class="card">
        <div class="card-hd">
          <div class="lbl">Equity Curve</div>
          <div class="sec-sub mono desktop-only" id="chartRange" style="margin:0;">--</div>
        </div>
        <div class="chart-scroll" id="chartScroll">
          <svg id="eqSvg" viewBox="0 0 600 185" preserveAspectRatio="none" style="width:100%;">
            <line id="seedLine" x1="0" y1="92" x2="600" y2="92" stroke="#334155" stroke-width="1" stroke-dasharray="4 4" />
            <polyline id="eqLine" fill="none" stroke="#10b981" stroke-width="2.5" points="0,92 600,92" />
          </svg>
        </div>
      </div>
      <div class="card">
        <div class="card-hd">
          <div class="lbl">Positions &amp; Trades</div>
          <div class="sec-sub mono" id="tradeMeta" style="margin:0;font-size:0.7rem;">0 closed</div>
        </div>
        <div class="tbl-wrap" id="tradeViewport">
          <table>
            <thead>
              <tr><th>Mkt</th><th>Side</th><th>Size ($USD)</th><th>Entry</th><th>Target / Exit</th><th>Ords / Time</th><th>PnL</th></tr>
            </thead>
            <tbody id="openBody"></tbody>
            <tbody id="closedBody"><tr><td colspan="7" style="color:var(--muted);">Loading live ledger…</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script>
    const ACCT_INDEX = 770015;
    const API_URL = "https://crypto-arb-bot-tokyo-bin-767579108352.s3.ap-northeast-1.amazonaws.com/live-telemetry.json?t=";
    const LT_TRADES_API = `https://mainnet.zklighter.elliot.ai/api/v1/trades?account_index=${ACCT_INDEX}&limit=100&sort_by=timestamp`;
    const STORE_KEY = "lighter_eq_hist_v3_" + ACCT_INDEX;
    const SEED_KEY = "lighter_seed_v2_" + ACCT_INDEX;
    const RR_KEY = "lighter_rr_base_v3_" + ACCT_INDEX;

    const ROW_H = window.innerWidth <= 768 ? 34 : 36;
    const OVERSCAN = 5;
    const MAX_RING = 50000;

    let seedUsd = parseFloat(localStorage.getItem(SEED_KEY) || "100.00");
    document.getElementById("seedInput").value = seedUsd.toFixed(2);
    let eqHist = JSON.parse(localStorage.getItem(STORE_KEY) || "[]");
    let rrBase = JSON.parse(localStorage.getItem(RR_KEY) || "null");
    let didInitialScroll = false;
    let eqDirty = true;
    let lastSaveTs = 0;

    let lastData = null;
    let activeOpenMkts = [];
    const POS_TIMERS = {};

    // O(1) Incremental Ring-Buffer + Cursor Lazy-Loader for Closed Trades
    const seenTradeIds = new Set();
    let closedList = []; // sorted newest-first (ts desc, id desc)
    let olderCursor = null;
    let loadingOlder = false;
    let olderExhausted = false;
    let lastVStart = -1;
    let lastVEnd = -1;
    let lastVLen = -1;
    let scrollRaf = false;

    const istFmt = new Intl.DateTimeFormat("en-IN", {
      timeZone: "Asia/Kolkata", hour12: false, hour: "2-digit", minute: "2-digit", second: "2-digit"
    });
    function fmtIST(ms) { return ms ? istFmt.format(new Date(ms)) : "--"; }
    function fmtSigned(v, dec = 4) { return `${v >= 0 ? "+" : "-"}$${Math.abs(v).toFixed(dec)}`; }
    function colorCls(v) { return v >= 0 ? "pos" : "neg"; }
    function fmtPx(px, sym) {
      if (!px || !isFinite(px)) return "—";
      const dec = sym === "BTC" ? 1 : (sym === "ETH" ? 2 : 3);
      return "$" + px.toFixed(dec);
    }
    function fmtQty(sz, sym) {
      const dec = sym === "BTC" ? 5 : (sym === "ETH" ? 4 : 3);
      return parseFloat(sz.toFixed(dec)).toString();
    }
    function fmtAgo(ms) {
      if (!ms || ms < 0) return "0s";
      const s = Math.floor(ms / 1000);
      if (s < 60) return `${s}s`;
      const m = Math.floor(s / 60);
      if (m < 60) return `${m}m ${s % 60}s`;
      return `${Math.floor(m / 60)}h ${m % 60}m`;
    }

    function saveSeed() {
      const v = parseFloat(document.getElementById("seedInput").value);
      if (!isNaN(v) && v > 0) {
        seedUsd = v;
        localStorage.setItem(SEED_KEY, String(v));
        eqDirty = true;
        renderSummary();
      }
    }
    function resetHistory() {
      const curEq = lastData ? parseFloat(lastData.total_asset_value ?? lastData.collateral ?? seedUsd) : seedUsd;
      eqHist = [{ t: Date.now(), v: curEq, c: curEq }];
      localStorage.setItem(STORE_KEY, JSON.stringify(eqHist));
      eqDirty = true;
      renderSummary();
    }

    function windowDelta(msAgo, nowTs, curVal, useCol = false) {
      const targetTs = nowTs - msAgo;
      let ref = eqHist.length ? eqHist[0] : null;
      for (let i = eqHist.length - 1; i >= 0; i--) {
        if (eqHist[i].t <= targetTs) { ref = eqHist[i]; break; }
      }
      if (!ref) return 0;
      return curVal - (useCol ? (ref.c ?? ref.v) : ref.v);
    }

    // O(K) Incremental Trade Parser using exact Lighter Sequencer bid_account_pnl / ask_account_pnl
    function ingestTrades(trades, isOlderBatch = false) {
      if (!Array.isArray(trades) || !trades.length) return false;
      const added = [];
      for (let i = 0; i < trades.length; i++) {
        const t = trades[i];
        const tid = t.trade_id;
        if (!tid || seenTradeIds.has(tid)) continue;
        seenTradeIds.add(tid);

        const isBid = Number(t.bid_account_id) === ACCT_INDEX;
        const isAsk = Number(t.ask_account_id) === ACCT_INDEX;
        const pStr = isBid ? t.bid_account_pnl : (isAsk ? t.ask_account_pnl : null);
        if (pStr === null || pStr === undefined || pStr === "") continue;
        const pnl = parseFloat(pStr);
        if (!isFinite(pnl) || Math.abs(pnl) < 1e-8) continue;

        const sym = t.market_symbol || ("MKT-" + t.market_id);
        const sz = parseFloat(t.size || 0);
        const exitPx = parseFloat(t.price || 0);
        const usd = parseFloat(t.usd_amount || (sz * exitPx));
        // ReduceOnly close: selling (isAsk) closes a LONG; buying (isBid) closes a SHORT
        const isLong = isAsk;
        const entryPx = sz > 1e-9 ? (isLong ? exitPx - (pnl / sz) : exitPx + (pnl / sz)) : exitPx;
        const ts = Number(t.timestamp) || Date.now();

        added.push({
          id: tid, sym, side: isLong ? "LONG" : "SHORT",
          sz, usd, entry: entryPx, exit: exitPx, pnl, ts,
          timeStr: fmtIST(ts)
        });
      }
      if (!added.length) return false;

      if (isOlderBatch && closedList.length) {
        added.sort((a, b) => (b.ts - a.ts) || (b.id - a.id));
        closedList.push(...added);
      } else {
        closedList.push(...added);
        closedList.sort((a, b) => (b.ts - a.ts) || (b.id - a.id));
      }
      if (closedList.length > MAX_RING) closedList.length = MAX_RING;
      return true;
    }

    async function loadOlderTrades() {
      if (loadingOlder || olderExhausted) return;
      loadingOlder = true;
      try {
        const url = olderCursor ? `${LT_TRADES_API}&cursor=${encodeURIComponent(olderCursor)}` : LT_TRADES_API;
        const r = await fetch(url);
        const d = await r.json();
        const batch = d.trades || [];
        olderCursor = d.next_cursor || null;
        if (!batch.length || !olderCursor) olderExhausted = true;
        if (ingestTrades(batch, true)) {
          renderVirtualClosed(true);
        }
      } catch (_) {
      } finally {
        loadingOlder = false;
      }
    }

    function renderOpenPositions() {
      const openBody = document.getElementById("openBody");
      if (!activeOpenMkts.length) {
        if (openBody.innerHTML !== "") openBody.innerHTML = "";
        return;
      }
      const nowTs = Date.now();
      let html = "";
      for (let i = 0; i < activeOpenMkts.length; i++) {
        const p = activeOpenMkts[i];
        const sym = p.symbol || ("MKT-" + p.market_id);
        const rawSz = parseFloat(p.position || 0);
        const sz = (p.sign !== undefined && p.sign < 0 && rawSz > 0) ? -rawSz : rawSz;
        const absSz = Math.abs(sz);
        const upnl = parseFloat(p.unrealized_pnl || 0);
        const sideLbl = absSz === 0 ? "QUOTE" : (sz > 0 ? "LONG" : "SHORT");
        const ords = p.open_order_count || 0;
        const stKey = `${sideLbl}_${ords}`;
        if (!POS_TIMERS[sym] || POS_TIMERS[sym].key !== stKey) {
          POS_TIMERS[sym] = { key: stKey, ts: nowTs };
        }
        const elapsedMs = nowTs - POS_TIMERS[sym].ts;
        const entry = parseFloat(p.avg_entry_price || 0);
        const usd = absSz * entry;
        // v42 decay schedule: 0-35s +4.8bps (up to +8.5bps momentum ride), 35-70s +2.5bps, 70-100s +0.5bps, 100s+ -1.5bps
        const stepBps = elapsedMs >= 100000 ? -1.5 : (elapsedMs >= 70000 ? 0.5 : (elapsedMs >= 35000 ? 2.5 : 4.8));
        const tgt = (absSz > 0 && entry > 0) ? (sz > 0 ? entry * (1 + stepBps / 10000) : entry * (1 - stepBps / 10000)) : null;
        const cdTxt = absSz > 0
          ? (elapsedMs < 35000 ? `⏳${fmtAgo(35000 - elapsedMs)}` : (elapsedMs < 70000 ? `⏳${fmtAgo(70000 - elapsedMs)}` : (elapsedMs < 100000 ? `⏳${fmtAgo(100000 - elapsedMs)}` : "SCRATCH")))
          : `⏳${fmtAgo(Math.max(0, 35000 - (elapsedMs % 35000)))}`;
        const szTxt = absSz > 0 ? `${fmtQty(absSz, sym)}<span class="usd-sub">($${usd.toFixed(1)})</span>` : "0";
        html += `<tr>
          <td class="mono"><b>${sym}</b></td>
          <td class="${absSz === 0 ? "" : (sz > 0 ? "pos" : "neg")}"><b>${sideLbl}</b></td>
          <td class="mono">${szTxt}</td>
          <td class="mono">${entry > 0 ? fmtPx(entry, sym) : "—"}</td>
          <td class="mono" style="color:var(--muted);">${tgt === null ? "—" : fmtPx(tgt, sym)}</td>
          <td class="mono">${ords} <span style="color:var(--muted);">· ${cdTxt}</span></td>
          <td class="mono ${colorCls(upnl)}">${fmtSigned(upnl, 4)}</td>
        </tr>`;
      }
      openBody.innerHTML = html;
    }

    // O(1) Virtual-Scroll Renderer: mounts at most ~16 rows regardless of 50 or 50,000 trades
    function renderVirtualClosed(force = false) {
      const vp = document.getElementById("tradeViewport");
      const closedBody = document.getElementById("closedBody");
      const total = closedList.length;
      const metaEl = document.getElementById("tradeMeta");
      metaEl.textContent = `${activeOpenMkts.length ? activeOpenMkts.length + " live · " : ""}${total} closed${olderExhausted ? "" : "+"}`;

      if (total === 0) {
        if (!activeOpenMkts.length) {
          closedBody.innerHTML = '<tr><td colspan="7" style="color:var(--muted);">No open positions or closed trades</td></tr>';
        } else {
          closedBody.innerHTML = "";
        }
        lastVLen = 0;
        return;
      }

      const openH = activeOpenMkts.length * ROW_H;
      const adjScrollTop = Math.max(0, vp.scrollTop - openH);
      const visCount = Math.ceil((vp.clientHeight || 256) / ROW_H) + OVERSCAN * 2;
      const start = Math.max(0, Math.floor(adjScrollTop / ROW_H) - OVERSCAN);
      const end = Math.min(total, start + visCount);

      if (!force && start === lastVStart && end === lastVEnd && total === lastVLen) return;
      lastVStart = start;
      lastVEnd = end;
      lastVLen = total;

      const topPad = start * ROW_H;
      const botPad = Math.max(0, (total - end) * ROW_H);

      let html = topPad > 0 ? `<tr class="vspacer"><td colspan="7" style="height:${topPad}px;"></td></tr>` : "";
      for (let i = start; i < end; i++) {
        const c = closedList[i];
        html += `<tr>
          <td class="mono"><b>${c.sym}</b></td>
          <td><span class="badge" style="font-size:0.6rem;padding:0.08rem 0.36rem;">CLOSED</span> <span class="${c.side === "LONG" ? "pos" : "neg"}" style="font-size:0.71rem;">${c.side}</span></td>
          <td class="mono">${fmtQty(c.sz, c.sym)}<span class="usd-sub">($${c.usd.toFixed(1)})</span></td>
          <td class="mono">${fmtPx(c.entry, c.sym)}</td>
          <td class="mono" style="color:var(--muted);">${fmtPx(c.exit, c.sym)}</td>
          <td class="mono" style="color:var(--muted);">${c.timeStr} IST</td>
          <td class="mono ${colorCls(c.pnl)}">${fmtSigned(c.pnl, 4)}</td>
        </tr>`;
      }
      if (botPad > 0) html += `<tr class="vspacer"><td colspan="7" style="height:${botPad}px;"></td></tr>`;
      closedBody.innerHTML = html;
    }

    document.getElementById("tradeViewport").addEventListener("scroll", function () {
      if (scrollRaf) return;
      scrollRaf = true;
      requestAnimationFrame(() => {
        scrollRaf = false;
        renderVirtualClosed(false);
        const vp = document.getElementById("tradeViewport");
        if (vp.scrollTop + vp.clientHeight >= vp.scrollHeight - 140) {
          loadOlderTrades();
        }
      });
    }, { passive: true });

    function renderSummary() {
      if (!lastData) return;
      const eq = parseFloat(lastData.total_asset_value ?? lastData.collateral ?? 0);
      const col = parseFloat(lastData.collateral ?? eq);
      const nowTs = Date.now();

      const pnl = eq - seedUsd;
      const roi = seedUsd > 0 ? ((pnl / seedUsd) * 100).toFixed(2) : "0.00";
      document.getElementById("eqVal").textContent = `$${eq.toFixed(4)}`;
      document.getElementById("realSub").innerHTML =
        `<span>Net <b class="${colorCls(pnl)}">${fmtSigned(pnl, 4)} (${roi}%)</b></span>`;

      const d5m = windowDelta(5 * 60e3, nowTs, eq);
      const d15m = windowDelta(15 * 60e3, nowTs, eq);
      const d1h = windowDelta(60 * 60e3, nowTs, eq);
      const d24h = windowDelta(24 * 3600e3, nowTs, eq);
      const d1hCol = windowDelta(60 * 60e3, nowTs, col, true);

      const basePt = rrBase || (eqHist.length > 1 ? { t: eqHist[0].t, v: eqHist[0].c ?? eqHist[0].v } : null);
      const elapsedMs = basePt ? Math.max(nowTs - basePt.t, 0) : 0;
      const elapsedHrs = Math.max(elapsedMs / 3600e3, 1 / 60);
      const hrRate = !basePt || elapsedMs < 3000 ? 0 : (elapsedHrs >= 1.0 ? d1hCol : (col - basePt.v) / elapsedHrs);
      const hrEl = document.getElementById("hrRate");
      hrEl.textContent = `${fmtSigned(hrRate, 4)}/hr`;
      hrEl.className = "hero-pnl mono " + colorCls(hrRate);
      document.getElementById("dayRate").textContent = `${fmtSigned(hrRate * 24, 2)}/day`;

      for (const [id, val] of [["tf5m", d5m], ["tf15m", d15m], ["tf1h", d1h], ["tf24h", d24h]]) {
        const el = document.getElementById(id);
        el.textContent = fmtSigned(val, 3);
        el.className = colorCls(val);
      }

      document.getElementById("tierBadge").textContent = lastData.account_type === 0 ? "0% FEE" : "PRO";
      document.getElementById("acctSub").textContent = `#${ACCT_INDEX} • ${fmtIST(nowTs)} IST`;

      if (eqDirty && eqHist.length >= 2) {
        eqDirty = false;
        const sc = document.getElementById("chartScroll");
        const svg = document.getElementById("eqSvg");
        const atRight = sc.scrollLeft + sc.clientWidth >= sc.scrollWidth - 24;
        const svgW = Math.max(sc.clientWidth || 560, eqHist.length * 6);
        svg.setAttribute("viewBox", `0 0 ${svgW} 185`);
        svg.style.width = `${svgW}px`;
        let minV = seedUsd, maxV = seedUsd;
        for (let i = 0; i < eqHist.length; i++) {
          if (eqHist[i].v < minV) minV = eqHist[i].v;
          if (eqHist[i].v > maxV) maxV = eqHist[i].v;
        }
        const span = Math.max(maxV - minV, 0.001);
        const pts = new Array(eqHist.length);
        const denom = eqHist.length - 1;
        for (let i = 0; i < eqHist.length; i++) {
          pts[i] = `${((i / denom) * svgW).toFixed(1)},${(172 - ((eqHist[i].v - minV) / span) * 158).toFixed(1)}`;
        }
        const seedY = (172 - ((seedUsd - minV) / span) * 158).toFixed(1);
        const sLine = document.getElementById("seedLine");
        sLine.setAttribute("x2", svgW);
        sLine.setAttribute("y1", seedY);
        sLine.setAttribute("y2", seedY);
        const line = document.getElementById("eqLine");
        line.setAttribute("points", pts.join(" "));
        line.setAttribute("stroke", pnl >= 0 ? "#10b981" : "#ef4444");
        document.getElementById("chartRange").textContent = `$${minV.toFixed(4)} – $${maxV.toFixed(4)}`;
        if (!didInitialScroll || atRight) {
          sc.scrollLeft = sc.scrollWidth;
          didInitialScroll = true;
        }
      }

      const prevOpenLen = activeOpenMkts.length;
      activeOpenMkts = (lastData.positions || []).filter(
        p => Math.abs(parseFloat(p.position || 0)) > 0 || (p.open_order_count || 0) > 0
      );
      renderOpenPositions();
      if (activeOpenMkts.length !== prevOpenLen) {
        renderVirtualClosed(true);
      }
    }

    async function poll() {
      try {
        const res = await fetch(API_URL + Date.now());
        const data = await res.json();
        const acct = data.lighterAccount || (data.accounts || [])[0];
        const tradesChanged = data.lighterTrades ? ingestTrades(data.lighterTrades, false) : false;
        if (!acct) return;
        lastData = acct;
        const eq = parseFloat(acct.total_asset_value ?? acct.collateral ?? 0);
        const col = parseFloat(acct.collateral ?? eq);
        const now = Date.now();
        if (!eqHist.length || now - eqHist[eqHist.length - 1].t >= 5000) {
          eqHist.push({ t: now, v: eq, c: col });
          if (eqHist.length > 2500) eqHist = eqHist.slice(-2500);
          eqDirty = true;
          if (now - lastSaveTs >= 15000) {
            lastSaveTs = now;
            localStorage.setItem(STORE_KEY, JSON.stringify(eqHist));
          }
        }
        document.getElementById("liveDot").style.background = "#10b981";
        renderSummary();
        if (tradesChanged || lastVLen < 0) renderVirtualClosed(true);
      } catch (_) {
        document.getElementById("liveDot").style.background = "#ef4444";
      }
    }

    async function refreshRunRate() {
      const btn = document.getElementById("rrBtn");
      if (btn) btn.textContent = "…";
      await poll();
      if (lastData) {
        const col = parseFloat(lastData.collateral ?? lastData.total_asset_value ?? 0);
        rrBase = { t: Date.now(), v: col };
        localStorage.setItem(RR_KEY, JSON.stringify(rrBase));
      }
      renderSummary();
      if (btn) {
        btn.textContent = "✓";
        setTimeout(() => { btn.textContent = "↻"; }, 800);
      }
    }

    poll();
    loadOlderTrades(); // Seed cursor state for seamless infinite scroll
    setInterval(poll, 2000);
    setInterval(() => { if (activeOpenMkts.length) renderOpenPositions(); }, 1000);
  </script>
</body>
</html>
