name: KISS Tokyo Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Python Syntax
        run: python3 -m py_compile tokyo_engine/telemetry_sync.py tokyo_engine/instant_pause.py

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build lighter_go_bot (linux/amd64)
        working-directory: tokyo_engine/lighter_go
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o lighter_go_bot .

      - name: Build arena_go (linux/amd64)
        working-directory: tokyo_engine/arena_go
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o arena_go .

      - name: Upload Binary to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lighter-go-latest
          files: |
            tokyo_engine/lighter_go/lighter_go_bot
            tokyo_engine/arena_go/arena_go
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-tokyo:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Configure S3 Bucket CORS
        run: |
          aws s3api put-bucket-cors \
            --bucket crypto-arb-bot-tokyo-bin-767579108352 \
            --cors-configuration '{"CORSRules":[{"AllowedHeaders":["*"],"AllowedMethods":["GET","PUT","POST","HEAD"],"AllowedOrigins":["*"],"ExposeHeaders":["ETag"],"MaxAgeSeconds":86400}]}'

      - name: Deploy Clean Binary & Telemetry via SSM
        run: |
          INST_ID="i-046fed60c07b7a799"
          SSM_JSON=$(jq -nc --arg sha "$GITHUB_SHA" '{commands:[
            "set -e",
            "sudo mkdir -p /opt/crypto-arb-bot/_legacy_archive_do_not_access",
            "for p in /opt/crypto-arb-bot/*; do b=$(basename \"$p\"); case \"$b\" in telemetry_sync.py|lighter_go_bot|arena_go|dn_trades_history.json|forward_arena_state.json|live_arena_state.json|_legacy_archive_do_not_access) ;; *) sudo mv \"$p\" /opt/crypto-arb-bot/_legacy_archive_do_not_access/ 2>/dev/null || true ;; esac; done",
            ("curl -fsSL https://raw.githubusercontent.com/Abishek17703/crypto-arb-bot/" + $sha + "/tokyo_engine/telemetry_sync.py -o /tmp/telemetry_sync_new.py"),
            "sudo python3 -m py_compile /tmp/telemetry_sync_new.py",
            "sudo systemctl stop tokyo-telemetry.service || true",
            "sudo pkill -9 -f 'python3.*[t]elemetry_sync' || true",
            "sudo pkill -9 -f '/opt/crypto-arb-bot/arena_go' || true",
            "sudo pkill -15 -f '/opt/crypto-arb-bot/lighter_go_bot' || true",
            "sleep 1",
            "sudo mv /tmp/telemetry_sync_new.py /opt/crypto-arb-bot/telemetry_sync.py && sudo chmod +x /opt/crypto-arb-bot/telemetry_sync.py",
            "sudo curl -fsSL https://github.com/Abishek17703/crypto-arb-bot/releases/download/lighter-go-latest/lighter_go_bot -o /opt/crypto-arb-bot/lighter_go_bot.tmp && sudo mv /opt/crypto-arb-bot/lighter_go_bot.tmp /opt/crypto-arb-bot/lighter_go_bot && sudo chmod +x /opt/crypto-arb-bot/lighter_go_bot",
            "sudo curl -fsSL https://github.com/Abishek17703/crypto-arb-bot/releases/download/lighter-go-latest/arena_go -o /opt/crypto-arb-bot/arena_go.tmp && sudo mv /opt/crypto-arb-bot/arena_go.tmp /opt/crypto-arb-bot/arena_go && sudo chmod +x /opt/crypto-arb-bot/arena_go",
            "sudo rm -f /tmp/lighter_trades.json /tmp/forward_arena.json",
            "sudo sh -c 'if [ -f /tmp/lighter_pause.flag ]; then /opt/crypto-arb-bot/lighter_go_bot >> /tmp/lighter_tokyo.log 2>&1 || true; fi'",
            "sudo systemctl start tokyo-telemetry.service",
            "sleep 6 && sudo systemctl is-active tokyo-telemetry.service && ps aux | grep '[t]elemetry_sync'"
          ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INST_ID" --document-name "AWS-RunShellScript" --parameters "$SSM_JSON" --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          STATUS="Pending"
          for i in $(seq 1 20); do
            sleep 3
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INST_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Poll $i: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INST_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text || true
          [ "$STATUS" = "Success" ]

  build-apk:
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check mobile_app Changes
        id: chg
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || git diff --name-only HEAD~1 HEAD | grep -q '^mobile_app/'; then
            echo "run_apk=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_apk=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.chg.outputs.run_apk == 'true'
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.chg.outputs.run_apk == 'true'
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        if: steps.chg.outputs.run_apk == 'true'
        working-directory: mobile_app
        run: gradle assembleDebug --no-daemon --max-workers=2

      - name: Upload APK Artifact
        if: steps.chg.outputs.run_apk == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: lighter-live-apk
          path: mobile_app/app/build/outputs/apk/debug/app-debug.apk
