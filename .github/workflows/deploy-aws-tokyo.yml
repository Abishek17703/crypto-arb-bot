name: Deploy Zero-Cost Arbitrage Bot to AWS

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: 'Email for the $0.01 AWS Zero-Spend Budget Alert'
        required: true
        default: 'abishek17703@gmail.com'
      live_armed:
        description: 'Arm Live Binance Execution (false = Live-Signed Shadow Mode)'
        required: true
        type: boolean
        default: false
      audit_only:
        description: 'Run 365-Day $0.00 Full Account Audit, Unused Resource Cleanup & Credits Report'
        required: false
        type: boolean
        default: true
      binance_api_key:
        description: 'Binance Spot Testnet or Live API Key'
        required: false
        default: ''
      binance_api_secret:
        description: 'Binance Spot Testnet or Live API Secret'
        required: false
        default: ''

jobs:
  deploy-zero-cost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Auto-Detect Fastest Allowed AWS Region
        id: region_probe
        run: |
          SELECTED_REGION=""
          for REGION in ap-northeast-1 ap-southeast-1 ap-southeast-2 us-east-1 us-west-2; do
            echo -n "Testing $REGION ... "
            if aws ec2 describe-availability-zones --region "$REGION" >/dev/null 2>&1; then
              echo "✅ ALLOWED!"
              SELECTED_REGION="$REGION"
              break
            else
              echo "❌ Not enabled yet"
            fi
          done
          echo "Selected Region: $SELECTED_REGION"
          echo "aws_region=$SELECTED_REGION" >> "$GITHUB_OUTPUT"

      - name: Deploy or Verify CloudFormation Stack (t3.micro + CPUCredits=standard)
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          B_KEY="${{ inputs.binance_api_key || secrets.BINANCE_API_KEY }}"
          B_SEC="${{ inputs.binance_api_secret || secrets.BINANCE_API_SECRET }}"
          aws cloudformation deploy --region "$REGION" \
            --template-file aws-tokyo-zero-cost-stack.yaml \
            --stack-name crypto-arb-bot-zero-cost \
            --parameter-overrides \
              AlertEmail="${{ inputs.alert_email }}" \
              GitRepoUrl="$REPO_URL" \
              BinanceApiKey="$B_KEY" \
              BinanceApiSecret="$B_SEC" \
            --no-fail-on-empty-changeset

      - name: Full AWS Account $0.00 Guarantee Audit, Unused Resource Cleanup & Credits Inspection
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          echo "================================================================================"
          echo "   FULL AWS ACCOUNT AUDIT & CLEANUP (Account: $ACCOUNT_ID | Region: $REGION)"
          echo "================================================================================"

          echo -e "\n--- 1. EC2 INSTANCES & CPU CREDIT LOCK AUDIT ---"
          aws ec2 describe-instances --region "$REGION" \
            --filters "Name=instance-state-name,Values=running,pending,stopped" \
            --query "Reservations[*].Instances[*].{ID:InstanceId,Type:InstanceType,State:State.Name,AZ:Placement.AvailabilityZone,PublicIP:PublicIpAddress}" \
            --output table

          # Verify CPU Credit Specification on our running instance
          INST_ID=$(aws cloudformation describe-stacks --region "$REGION" --stack-name crypto-arb-bot-zero-cost --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)
          echo "Checking CPU Credit Specification for $INST_ID:"
          aws ec2 describe-instance-credit-specifications --region "$REGION" --instance-ids "$INST_ID" --output table

          # Terminate any OTHER stray/unused EC2 instances if they exist
          OTHER_INSTANCES=$(aws ec2 describe-instances --region "$REGION" \
            --filters "Name=instance-state-name,Values=running,stopped" \
            --query "Reservations[*].Instances[?InstanceId!='$INST_ID'].InstanceId" --output text)
          if [ -n "$OTHER_INSTANCES" ]; then
            echo "Cleaning up unused EC2 instances: $OTHER_INSTANCES"
            aws ec2 terminate-instances --region "$REGION" --instance-ids $OTHER_INSTANCES
          else
            echo "✅ Zero stray/unused EC2 instances found. Only $INST_ID (t3.micro) is active."
          fi

          echo -e "\n--- 2. UNATTACHED EBS VOLUMES & SNAPSHOTS CLEANUP ---"
          UNATTACHED_VOLS=$(aws ec2 describe-volumes --region "$REGION" \
            --filters "Name=status,Values=available" \
            --query "Volumes[*].VolumeId" --output text)
          if [ -n "$UNATTACHED_VOLS" ]; then
            for V in $UNATTACHED_VOLS; do
              echo "Deleting unattached EBS volume: $V"
              aws ec2 delete-volume --region "$REGION" --volume-id "$V"
            done
          else
            echo "✅ Zero unattached EBS volumes found."
          fi
          aws ec2 describe-volumes --region "$REGION" --query "Volumes[*].{VolumeId:VolumeId,SizeGB:Size,Type:VolumeType,State:State}" --output table

          echo -e "\n--- 3. UNATTACHED ELASTIC IPs & NAT GATEWAYS AUDIT ---"
          UNATTACHED_EIPS=$(aws ec2 describe-addresses --region "$REGION" --query "Addresses[?AssociationId==null].AllocationId" --output text)
          if [ -n "$UNATTACHED_EIPS" ]; then
            for EIP in $UNATTACHED_EIPS; do
              echo "Releasing unattached Elastic IP: $EIP"
              aws ec2 release-address --region "$REGION" --allocation-id "$EIP"
            done
          else
            echo "✅ Zero unattached Elastic IPs found."
          fi
          NATS=$(aws ec2 describe-nat-gateways --region "$REGION" --filter "Name=state,Values=available,pending" --query "NatGateways[*].NatGatewayId" --output text)
          echo "Active NAT Gateways: ${NATS:-NONE (0 cost)}"

          echo -e "\n--- 4. OTHER CLOUDFORMATION STACKS / UNUSED PROJECTS AUDIT ---"
          aws cloudformation list-stacks --region "$REGION" \
            --stack-status-filter CREATE_COMPLETE UPDATE_COMPLETE ROLLBACK_COMPLETE \
            --query "StackSummaries[*].{Name:StackName,Status:StackStatus}" --output table

          echo -e "\n--- 5. RDS, ELB, LIGHTSAIL, S3 AUDIT ---"
          ELBS=$(aws elbv2 describe-load-balancers --region "$REGION" --query "LoadBalancers[*].LoadBalancerName" --output text 2>/dev/null || echo "None")
          echo "Active Load Balancers : ${ELBS:-NONE (0 cost)}"
          RDS=$(aws rds describe-db-instances --region "$REGION" --query "DBInstances[*].DBInstanceIdentifier" --output text 2>/dev/null || echo "None")
          echo "Active RDS Databases  : ${RDS:-NONE (0 cost)}"
          BUCKETS=$(aws s3api list-buckets --query "Buckets[*].Name" --output text 2>/dev/null || echo "None")
          echo "Active S3 Buckets     : ${BUCKETS:-NONE (0 cost)}"

          echo -e "\n--- 6. AWS BILLING, BUDGETS ($20 LIMIT), FREE TIER & CREDITS AUDIT ---"
          aws budgets describe-budgets --account-id "$ACCOUNT_ID" --output table 2>&1 || true
          aws ce get-cost-and-usage \
            --time-period Start=2026-11-01,End=2026-11-09 \
            --granularity MONTHLY \
            --metrics "UnblendedCost" "NetUnblendedCost" \
            --output table 2>&1 || true
          aws freetier get-free-tier-usage --output table 2>&1 || true

      - name: Execute Live Binance Spot Testnet WS v3 Session on AWS EC2 Instance (Asia-Pacific)
        env:
          BINANCE_TESTNET_API_KEY: ${{ inputs.binance_api_key || secrets.BINANCE_API_KEY }}
          BINANCE_TESTNET_API_SECRET: ${{ inputs.binance_api_secret || secrets.BINANCE_API_SECRET }}
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          INST_ID=$(aws cloudformation describe-stacks --region "$REGION" --stack-name crypto-arb-bot-zero-cost --query "Stacks[0].Outputs[?OutputKey=='InstanceId'].OutputValue" --output text)
          SG_ID=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" --output text)
          PUB_IP=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          AZ=$(aws ec2 describe-instances --region "$REGION" --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].Placement.AvailabilityZone" --output text)
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')

          echo "Connecting to live AWS EC2 Instance $INST_ID ($PUB_IP in $AZ) from $RUNNER_IP/32..."
          ssh-keygen -t ed25519 -f /tmp/ec2_key -N "" -q

          trap 'aws ec2 revoke-security-group-ingress --region "$REGION" --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" >/dev/null 2>&1 || true' EXIT
          aws ec2 authorize-security-group-ingress --region "$REGION" --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" >/dev/null 2>&1 || true

          aws ec2-instance-connect send-ssh-public-key \
            --region "$REGION" \
            --instance-id "$INST_ID" \
            --availability-zone "$AZ" \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/ec2_key.pub

          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 ec2-user@"$PUB_IP" \
            "BINANCE_TESTNET_API_KEY='$BINANCE_TESTNET_API_KEY' BINANCE_TESTNET_API_SECRET='$BINANCE_TESTNET_API_SECRET' bash -s" << 'REMOTEEOF'
          set -e
          echo "================================================================================"
          echo "   RUNNING ON LIVE AWS EC2 INSTANCE ($(hostname) - Asia-Pacific Zero-Geoblock)"
          echo "   1. QUERYING BINANCE SPOT TESTNET WALLET BALANCES (BEFORE PAPER RUN)"
          echo "================================================================================"
          python3 - << 'PYEOF'
          import hmac, hashlib, time, urllib.request, json, os
          key = os.environ["BINANCE_TESTNET_API_KEY"]
          secret = os.environ["BINANCE_TESTNET_API_SECRET"].encode()
          ts = int(time.time() * 1000)
          qs = f"recvWindow=5000&timestamp={ts}"
          sig = hmac.new(secret, qs.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              f"https://testnet.binance.vision/api/v3/account?{qs}&signature={sig}",
              headers={"X-MBX-APIKEY": key}
          )
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
              print("Account Type:", data.get("accountType"), "| CanTrade:", data.get("canTrade"))
              for b in data.get("balances", []):
                  asset = b["asset"]
                  free = b["free"]
                  locked = b["locked"]
                  if asset in ("USDT","FDUSD","BTC","ETH","SOL","BNB","USDC"):
                      print(f"  - {asset:6s} : Free = {free} | Locked = {locked}")
          PYEOF

          echo -e "\n================================================================================"
          echo "   2. APPLYING KERNEL BBR + BUSY-POLL & RUNNING WARM-SOCKET PING ON AWS EC2"
          echo "================================================================================"
          sudo bash -c '
            modprobe tcp_bbr 2>/dev/null || true
            sysctl -w net.core.default_qdisc=fq >/dev/null 2>&1 || true
            sysctl -w net.ipv4.tcp_congestion_control=bbr >/dev/null 2>&1 || true
            sysctl -w net.core.busy_poll=50 >/dev/null 2>&1 || true
            sysctl -w net.core.busy_read=50 >/dev/null 2>&1 || true
            sysctl -w net.ipv4.tcp_fastopen=3 >/dev/null 2>&1 || true
            export HOME=/root
            source /root/.cargo/env
            cd /opt/crypto-arb-bot
            git fetch origin main && git reset --hard origin/main
            cargo build --release
          '

          sudo env BINANCE_TESTNET_API_KEY="$BINANCE_TESTNET_API_KEY" \
                   BINANCE_TESTNET_API_SECRET="$BINANCE_TESTNET_API_SECRET" \
                   /opt/crypto-arb-bot/target/release/crypto-arb-bot \
                   --total-capital 10.0 --testnet --sim --realistic --pin-core 0 --ping-bench --duration-secs 4

          # Update the 24/7 background systemd service with Testnet keys on LIVE production orderbooks
          sudo bash -c "cat << EOF > /etc/systemd/system/crypto-arb-bot.service
          [Unit]
          Description=Ultra-Low Latency Rust Crypto Arbitrage Engine (\\\$10 Capital Guard)
          After=network-online.target

          [Service]
          Type=simple
          WorkingDirectory=/opt/crypto-arb-bot
          Environment=\"BINANCE_TESTNET_API_KEY=$BINANCE_TESTNET_API_KEY\"
          Environment=\"BINANCE_TESTNET_API_SECRET=$BINANCE_TESTNET_API_SECRET\"
          ExecStart=/opt/crypto-arb-bot/target/release/crypto-arb-bot --total-capital 10.0 --testnet --min-net-bps 1.5 --realistic --pin-core 0 --ping-bench --duration-secs 0
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now crypto-arb-bot.service
          systemctl restart crypto-arb-bot.service"

          echo -e "\n================================================================================"
          echo "   3. VERIFYING EXECUTED ORDERS & BALANCES INSIDE BINANCE SPOT TESTNET"
          echo "================================================================================"
          python3 - << 'PYEOF'
          import hmac, hashlib, time, urllib.request, json, os
          key = os.environ["BINANCE_TESTNET_API_KEY"]
          secret = os.environ["BINANCE_TESTNET_API_SECRET"].encode()

          for sym in ["BNBUSDT", "BTCUSDT", "ETHUSDT", "SOLUSDT"]:
              ts = int(time.time() * 1000)
              qs = f"limit=5&recvWindow=5000&symbol={sym}&timestamp={ts}"
              sig = hmac.new(secret, qs.encode(), hashlib.sha256).hexdigest()
              req = urllib.request.Request(
                  f"https://testnet.binance.vision/api/v3/myTrades?{qs}&signature={sig}",
                  headers={"X-MBX-APIKEY": key}
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      trades = json.loads(resp.read().decode())
                      if trades:
                          print(f"\n✅ Verified Binance Testnet Fills for {sym} ({len(trades)} recent fills):")
                          for t in trades[-3:]:
                              side = "BUY" if t.get("isBuyer") else "SELL"
                              tid = t["id"]
                              oid = t["orderId"]
                              qty = t["qty"]
                              price = t["price"]
                              qqty = t["quoteQty"]
                              print(f"  [Trade #{tid}] OrderID={oid} | {side} {qty} {sym} @ ${price} (QuoteQty=${qqty})")
              except Exception as e:
                  print(f"Error querying {sym}: {e}")

          ts = int(time.time() * 1000)
          qs = f"recvWindow=5000&timestamp={ts}"
          sig = hmac.new(secret, qs.encode(), hashlib.sha256).hexdigest()
          req = urllib.request.Request(
              f"https://testnet.binance.vision/api/v3/account?{qs}&signature={sig}",
              headers={"X-MBX-APIKEY": key}
          )
          with urllib.request.urlopen(req) as resp:
              data = json.loads(resp.read().decode())
              print("\nUpdated Binance Spot Testnet Balances (AFTER PAPER RUN):")
              for b in data.get("balances", []):
                  asset = b["asset"]
                  free = b["free"]
                  locked = b["locked"]
                  if asset in ("USDT","FDUSD","BTC","ETH","SOL","BNB","USDC"):
                      print(f"  - {asset:6s} : Free = {free} | Locked = {locked}")
          PYEOF
          REMOTEEOF

