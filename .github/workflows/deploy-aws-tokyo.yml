name: Deploy Zero-Cost Arbitrage Bot to AWS

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: 'Email for the $0.01 AWS Zero-Spend Budget Alert'
        required: true
        default: 'abishek17703@gmail.com'
      live_armed:
        description: 'Arm Live Binance Execution (false = Live-Signed Shadow Mode)'
        required: true
        type: boolean
        default: false

jobs:
  deploy-zero-cost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Auto-Detect Fastest Allowed AWS Region (Prioritizing Tokyo ap-northeast-1)
        id: region_probe
        run: |
          echo "Probing candidate AWS regions (Prioritizing #1 Tokyo ap-northeast-1 for 0.25ms ping)..."
          SELECTED_REGION=""
          for REGION in ap-northeast-1 ap-southeast-1 ap-southeast-2 us-east-1 us-west-2; do
            echo -n "Testing $REGION ... "
            if aws ec2 describe-availability-zones --region "$REGION" >/dev/null 2>&1; then
              echo "✅ ALLOWED!"
              SELECTED_REGION="$REGION"
              break
            else
              echo "❌ Not enabled yet"
            fi
          done

          if [ -z "$SELECTED_REGION" ]; then
            echo "::error::No enabled regions found."
            exit 1
          fi

          echo "Selected Fastest Permitted Region: $SELECTED_REGION"
          echo "aws_region=$SELECTED_REGION" >> "$GITHUB_OUTPUT"

      - name: Clean Up Any Previous Failed / Rollback Stack
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          STATUS=$(aws cloudformation describe-stacks --region "$REGION" --stack-name crypto-arb-bot-zero-cost --query "Stacks[0].StackStatus" --output text 2>/dev/null || echo "NONE")
          echo "Existing stack status in $REGION: $STATUS"
          if [ "$STATUS" = "ROLLBACK_COMPLETE" ] || [ "$STATUS" = "DELETE_FAILED" ]; then
            echo "Inspecting previous rollback events for diagnostics..."
            aws cloudformation describe-stack-events --region "$REGION" --stack-name crypto-arb-bot-zero-cost --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" --output table || true
            echo "Deleting ROLLBACK_COMPLETE stack so fresh deployment succeeds..."
            aws cloudformation delete-stack --region "$REGION" --stack-name crypto-arb-bot-zero-cost
            aws cloudformation wait stack-delete-complete --region "$REGION" --stack-name crypto-arb-bot-zero-cost
          fi

      - name: Pre-Deployment 365-Day $0.00 AWS Quota & Instance Check
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          RUNNING_COUNT=$(aws ec2 describe-instances --region "$REGION" \
            --filters "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text | wc -w)
          echo "Currently running instances in $REGION: $RUNNING_COUNT"

      - name: Deploy CloudFormation Stack (t3.micro + CPUCredits=standard)
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          REPO_URL="https://github.com/${{ github.repository }}.git"
          if ! aws cloudformation deploy --region "$REGION" \
            --template-file aws-tokyo-zero-cost-stack.yaml \
            --stack-name crypto-arb-bot-zero-cost \
            --parameter-overrides \
              AlertEmail="${{ inputs.alert_email }}" \
              GitRepoUrl="$REPO_URL" \
              BinanceApiKey="${{ secrets.BINANCE_API_KEY }}" \
              BinanceApiSecret="${{ secrets.BINANCE_API_SECRET }}" \
            --no-fail-on-empty-changeset; then
            echo "::error::CloudFormation deploy failed. Printing exact resource failure reason:"
            aws cloudformation describe-stack-events --region "$REGION" --stack-name crypto-arb-bot-zero-cost --query "StackEvents[?ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" --output table || true
            exit 1
          fi

      - name: Output Stack Status & Availability Zone
        run: |
          REGION="${{ steps.region_probe.outputs.aws_region }}"
          aws cloudformation describe-stacks --region "$REGION" \
            --stack-name crypto-arb-bot-zero-cost \
            --query "Stacks[0].Outputs" \
            --output table
