name: Deploy Zero-Cost Tokyo Arbitrage Bot to AWS

on:
  workflow_dispatch:
    inputs:
      alert_email:
        description: 'Email for the $0.01 AWS Zero-Spend Budget Alert'
        required: true
        default: 'admin@example.com'
      live_armed:
        description: 'Arm Live Binance Execution (false = Live-Signed Shadow Mode)'
        required: true
        type: boolean
        default: false

jobs:
  deploy-tokyo-zero-cost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials in Tokyo (ap-northeast-1)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Pre-Deployment 365-Day $0.00 AWS Quota & Instance Check
        run: |
          echo "Auditing existing EC2 instances in ap-northeast-1 to ensure only 1 Free-Tier instance runs..."
          RUNNING_COUNT=$(aws ec2 describe-instances \
            --filters "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[*].Instances[*].InstanceId" \
            --output text | wc -w)
          echo "Currently running instances in Tokyo: $RUNNING_COUNT"
          if [ "$RUNNING_COUNT" -gt 1 ]; then
            echo "::warning::More than 1 EC2 instance is running in ap-northeast-1! Ensure only 1 t3.micro runs 24/7 to stay within 750 hrs/mo Free Tier."
          fi

      - name: Deploy CloudFormation Stack (t3.micro + CPUCredits=standard + $0.01 Budget Guard)
        run: |
          REPO_URL="https://github.com/${{ github.repository }}.git"
          aws cloudformation deploy \
            --template-file aws-tokyo-zero-cost-stack.yaml \
            --stack-name crypto-arb-bot-tokyo-zero-cost \
            --parameter-overrides \
              AlertEmail="${{ inputs.alert_email }}" \
              GitRepoUrl="$REPO_URL" \
              BinanceApiKey="${{ secrets.BINANCE_API_KEY }}" \
              BinanceApiSecret="${{ secrets.BINANCE_API_SECRET }}" \
            --no-fail-on-empty-changeset

      - name: Output Stack Status & Tokyo Availability Zone
        run: |
          aws cloudformation describe-stacks \
            --stack-name crypto-arb-bot-tokyo-zero-cost \
            --query "Stacks[0].Outputs" \
            --output table
