name: Deploy Live Tokyo Engine v4.3

on:
  push:
    branches: [main, probe-aws-tokyo]
  workflow_dispatch:

jobs:
  deploy-tokyo-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy Upgraded telemetry_sync.py to Tokyo EC2 (i-046fed60c07b7a799)
        run: |
          INST_ID="i-046fed60c07b7a799"
          SG_ID=$(aws ec2 describe-instances --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].SecurityGroups[0].GroupId" --output text)
          PUB_IP=$(aws ec2 describe-instances --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          AZ=$(aws ec2 describe-instances --instance-ids "$INST_ID" --query "Reservations[0].Instances[0].Placement.AvailabilityZone" --output text)
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com | tr -d '[:space:]')

          ssh-keygen -t ed25519 -f /tmp/ec2_key -N "" -q
          trap 'aws ec2 revoke-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" >/dev/null 2>&1 || true' EXIT
          aws ec2 authorize-security-group-ingress --group-id "$SG_ID" --protocol tcp --port 22 --cidr "$RUNNER_IP/32" >/dev/null 2>&1 || true

          aws ec2-instance-connect send-ssh-public-key \
            --instance-id "$INST_ID" \
            --availability-zone "$AZ" \
            --instance-os-user ec2-user \
            --ssh-public-key file:///tmp/ec2_key.pub

          scp -i /tmp/ec2_key -o StrictHostKeyChecking=no tokyo_engine/telemetry_sync.py ec2-user@"$PUB_IP":/tmp/telemetry_sync_new.py

          ssh -i /tmp/ec2_key -o StrictHostKeyChecking=no -o ConnectTimeout=15 ec2-user@"$PUB_IP" << 'EOF'
          set -e
          sudo cp /opt/crypto-arb-bot/telemetry_sync.py /opt/crypto-arb-bot/telemetry_sync.bak.$(date +%s)
          sudo mv /tmp/telemetry_sync_new.py /opt/crypto-arb-bot/telemetry_sync.py
          sudo chmod +x /opt/crypto-arb-bot/telemetry_sync.py
          sudo python3 -m py_compile /opt/crypto-arb-bot/telemetry_sync.py
          sudo systemctl restart tokyo-telemetry.service
          sleep 4
          sudo systemctl status tokyo-telemetry.service --no-pager -n 12
          EOF
