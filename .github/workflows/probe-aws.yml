name: Deploy Live Tokyo Engine v4.3

on:
  push:
    branches: [main, probe-aws-tokyo]
  workflow_dispatch:

jobs:
  deploy-tokyo-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Deploy Clean telemetry_sync.py & lighter_go_bot to Tokyo EC2 (i-046fed60c07b7a799)
        run: |
          INST_ID="i-046fed60c07b7a799"
          SSM_JSON=$(jq -nc --arg sha "$GITHUB_SHA" '{commands:[
            "set -e",
            "sudo mkdir -p /opt/crypto-arb-bot/_legacy_archive_do_not_access",
            "for f in /opt/crypto-arb-bot/lighter_tokyo_bot.py /opt/crypto-arb-bot/audit_tiers.py /opt/crypto-arb-bot/telemetry_sync_backup*.py /opt/crypto-arb-bot/telemetry_sync.bak.* /opt/crypto-arb-bot/strategy_journal.log; do sudo mv \"$f\" /opt/crypto-arb-bot/_legacy_archive_do_not_access/ 2>/dev/null || true; done",
            "sudo cp /opt/crypto-arb-bot/telemetry_sync.py /opt/crypto-arb-bot/_legacy_archive_do_not_access/telemetry_sync.bak.$(date +%s) 2>/dev/null || true",
            ("curl -fsSL https://raw.githubusercontent.com/Abishek17703/crypto-arb-bot/" + $sha + "/tokyo_engine/telemetry_sync.py -o /tmp/telemetry_sync_new.py"),
            "sudo python3 -m py_compile /tmp/telemetry_sync_new.py",
            "sudo systemctl stop tokyo-telemetry.service || true",
            "sudo pkill -9 -f 'python3.*[t]elemetry_sync' || true",
            "sudo mv /tmp/telemetry_sync_new.py /opt/crypto-arb-bot/telemetry_sync.py && sudo chmod +x /opt/crypto-arb-bot/telemetry_sync.py",
            "sudo curl -fsSL https://github.com/Abishek17703/crypto-arb-bot/releases/download/lighter-go-latest/lighter_go_bot -o /opt/crypto-arb-bot/lighter_go_bot.tmp && sudo mv /opt/crypto-arb-bot/lighter_go_bot.tmp /opt/crypto-arb-bot/lighter_go_bot && sudo chmod +x /opt/crypto-arb-bot/lighter_go_bot",
            "sudo systemctl start tokyo-telemetry.service",
            "sleep 4 && sudo systemctl is-active tokyo-telemetry.service && ps aux | grep '[t]elemetry_sync'"
          ]}')
          CMD_ID=$(aws ssm send-command --instance-ids "$INST_ID" --document-name "AWS-RunShellScript" --parameters "$SSM_JSON" --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          STATUS="Pending"
          for i in $(seq 1 20); do
            sleep 3
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INST_ID" --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "Poll $i: $STATUS"
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INST_ID" --query "[StandardOutputContent,StandardErrorContent]" --output text || true
          [ "$STATUS" = "Success" ]
